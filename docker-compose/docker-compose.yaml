version: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: xguard
      POSTGRES_USER: xguard
      POSTGRES_PASSWORD: ${XGUARD_DB_PASSWORD}
    volumes:
      - ${VOLUME_DIR:-./.volumes}/db:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"

  # caddy:  # [PROXY]
  #   image: caddy:2-alpine  # [PROXY]
  #   restart: unless-stopped  # [PROXY]
  #   volumes:  # [PROXY]
  #     - ${VOLUME_DIR:-./.volumes}/caddy/data:/data  # [PROXY]
  #     - ${VOLUME_DIR:-./.volumes}/caddy/config:/config  # [PROXY]
  #     - ${VOLUME_DIR:-./.volumes}/caddy/Caddyfile:/etc/caddy/Caddyfile  # [PROXY]
  #   ports:  # [PROXY]
  #     # http  # [PROXY]
  #     - "80:80"  # [PROXY]
  #     # https  # [PROXY]
  #     - "443:443"  # [PROXY]

  core:
    image: ghcr.io/sajjad-alaa/xguard-core:${CORE_IMAGE_TAG:-1.6}
    restart: unless-stopped
    environment:
      XGUARD_AUTH_SECRET: ${XGUARD_AUTH_SECRET}
      XGUARD_GATEWAY_SECRET: ${XGUARD_GATEWAY_SECRET}
      XGUARD_YUBIBRIDGE_SECRET: ${XGUARD_YUBIBRIDGE_SECRET}
      XGUARD_SECRET_KEY: ${XGUARD_SECRET_KEY}
      XGUARD_DEFAULT_ADMIN_PASSWORD: ${XGUARD_DEFAULT_ADMIN_PASSWORD}
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432
      XGUARD_DB_USER: xguard
      XGUARD_DB_PASSWORD: ${XGUARD_DB_PASSWORD}
      XGUARD_DB_NAME: xguard
      XGUARD_URL: ${XGUARD_URL}
      XGUARD_LOG_LEVEL: info
      XGUARD_WEBAUTHN_RP_ID: ${XGUARD_WEBAUTHN_RP_ID}
      XGUARD_COOKIE_INSECURE: ${XGUARD_COOKIE_INSECURE:-false}
      # XGUARD_ENROLLMENT_URL: ${XGUARD_ENROLLMENT_URL}  # [ENROLLMENT]
      # XGUARD_PROXY_URL: https://proxy:50052  # [ENROLLMENT]
      # XGUARD_PROXY_GRPC_CA: /ssl/xguard-ca.pem  # [ENROLLMENT]
      XGUARD_GRPC_CERT: /ssl/xguard-grpc.crt
      XGUARD_GRPC_KEY: /ssl/xguard-grpc.key
      ## RSA setup guide: https://docs.xguard.local/deployment-strategies/openid-rsa-key
      XGUARD_OPENID_KEY: /keys/rsakey.pem
    ports:
      # web
      # - "8000:8000"
      # grpc
      - "50055:50055"
    depends_on:
      - db
    volumes:
      # SSL setup guide: https://docs.xguard.local/deployment-strategies/grpc-ssl-communication#custom-ssl-ca-and-certificates
      - ${VOLUME_DIR:-./.volumes}/ssl:/ssl
      ## RSA setup guide: https://docs.xguard.local/deployment-strategies/openid-rsa-key
      - ${VOLUME_DIR:-./.volumes}/core/rsakey.pem:/keys/rsakey.pem

  # proxy:  # [ENROLLMENT]
