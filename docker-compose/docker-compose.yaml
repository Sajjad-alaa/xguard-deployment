  #   volumes:  # [ENROLLMENT]
  # SSL setup guide: https://docs.xguard.local/deployment-strategies/grpc-ssl-communication#custom-ssl-ca-and-certificates
  #     - ${VOLUME_DIR:-./.volumes}/ssl:/ssl  # [ENROLLMENT]
  #   ports:
  #     # web
  #     - "8080:8080"
