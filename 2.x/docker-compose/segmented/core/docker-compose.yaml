services:
  core:
    logging:
      driver: journald
      options:
        tag: "xguard-core"
    image: ghcr.io/sajjad-alaa/xguard-core:2
    environment:    
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432

      # Make sure to change these credentials in production!
      XGUARD_DB_USER: xguard
      XGUARD_DB_PASSWORD: xguard
      XGUARD_DB_NAME: xguard
    depends_on:
      - db
    ports:
      # HTTP port for the web UI
      - "8000:8000"

  db:
    logging:
      driver: journald
      options:
        tag: "xguard-db"
    image: postgres:18-alpine
    environment:
      # Make sure to change these credentials in production!
      POSTGRES_DB: xguard
      POSTGRES_USER: xguard
      POSTGRES_PASSWORD: xguard
    volumes:
      - ./.volumes/db:/var/lib/postgresql
