services:
  edge:
    logging:
      driver: journald
      options:
        tag: "xguard-edge"
    image: ghcr.io/sajjad-alaa/xguard-proxy:2
    restart: unless-stopped
    container_name: "xguard-proxy"
    ports:
      # gRPC port for the Core to connect to
      - "50051:50051"
      # HTTP port for the web UI
      - "8080:8080"
      # HTTPS if you want to use the built-in TLS termination of the Proxy https://docs.xguard.local/tutorials/initial-setup-wizard-setting-up-from-scratch#configure-ssl-for-edge
      # - "443:443"
    volumes:
      - ./.volumes/certs/edge:/etc/xguard/certs
