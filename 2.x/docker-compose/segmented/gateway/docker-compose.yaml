services:
  gateway:
    logging:
      driver: journald
      options:
        tag: "xguard-gateway"
    image: ghcr.io/sajjad-alaa/xguard-gateway:2
    restart: unless-stopped
    container_name: "xguard-gateway"
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.volumes/certs/gateway:/etc/xguard/certs
