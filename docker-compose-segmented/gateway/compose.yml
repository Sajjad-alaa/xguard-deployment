services:
  gateway:
    image: ghcr.io/sajjad-alaa/xguard-gateway:latest
    restart: unless-stopped
    container_name: "xguard-gateway"
    network_mode: "host"
    environment:
      - XGUARD_GRPC_URL=<CORE_GRPC_URL>
      - XGUARD_TOKEN=<GATEWAY_TOKEN>
      - XGUARD_LOG_LEVEL=info
      # More info about securing gRPC communication here:
      # https://docs.xguard.local/deployment-strategies/grpc-ssl-communication#custom-ssl-ca-and-certificates
      # - XGUARD_GRPC_CA=/ca.pem
    # volumes:
    #   - ./ca.pem:/ca.pem
    cap_add:
      - NET_ADMIN
