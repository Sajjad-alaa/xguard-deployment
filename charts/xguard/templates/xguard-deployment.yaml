{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "XGuard Core runs as a single instance; replicaCount must be 1." }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
{{- fail "XGuard Core runs as a single instance; autoscaling.enabled must be false." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xguard.fullname" . }}
  labels:
    {{- include "xguard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "xguard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "xguard.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "xguard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          env:
            - name: XGUARD_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.existingSecretPasswordKey | default "password" }}
            - name: XGUARD_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingJwtSecret | default (include "xguard.jwtSecretName" .) }}
                  key: auth
            - name: XGUARD_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingJwtSecret | default (include "xguard.jwtSecretName" .) }}
                  key: gateway
            - name: XGUARD_YUBIBRIDGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingJwtSecret | default (include "xguard.jwtSecretName" .) }}
                  key: yubi-bridge
            - name: XGUARD_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingJwtSecret | default (include "xguard.jwtSecretName" .) }}
                  key: secret-key
            - name: XGUARD_OPENID_KEY
              value: "/etc/xguard-openid-key.pem"
          envFrom:
            - configMapRef:
                name: {{ include "xguard.fullname" . }}-config
            {{- if .Values.additionalEnvFromConfigMap }}
            - configMapRef:
                name: {{ .Values.additionalEnvFromConfigMap }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.web.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.service.grpc.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: openid-key
              mountPath: "/etc/xguard-openid-key.pem"
              readOnly: true
              subPath: openid-key
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: openid-key
          secret:
            secretName: {{ .Values.existingOpenIdSecret | default (include "xguard.openidSecretName" .) }}
            optional: false
