---
# yaml-language-server: $schema=values.schema.json
# this should be a URL based on xguard-proxy.ingress.grpc.host
proxyUrl: ""
# this should be a URL based on ingress.web.host
publicUrl: "http://xguard.local"
# Core runs as a single instance; autoscaling must remain disabled.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
# xguard-core cookie configuration
cookie:
  domain: ""
  insecure: false
# XGuard full name override
fullnameOverride: ""
# XGuard name override
nameOverride: ""
# XGuard-core container image configuration
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/sajjad-alaa/xguard-core
  tag: "" # overrides .Chart.AppVersion
# XGuard-core container image pull secrets
imagePullSecrets: []
# XGuard-core ingress configuration
ingress:
  grpc:
    annotations: {}
    className: ""
    enabled: true
    host: xguard-grpc.local
    labels: {}
    tls: false
  web:
    annotations: {}
    className: ""
    enabled: true
    host: xguard.local
    labels: {}
    tls: false
# xguard-core existing JWT secret
existingJwtSecret: ""
# xguard-core pod affinity configuration
affinity: {}
# xguard-core node selector cnfiguration
nodeSelector: {}
# xguard-core existing OpenID secret
existingOpenIdSecret: ""
# xguard-core pod annotation
podAnnotations: {}
# xguard-core pod labels
podLabels: {}
# xguard-core pod security context
podSecurityContext: {}
# xguard-core container security context
securityContext: {}
# Keep Core at one replica; other values are rejected.
replicaCount: 1
# xguard-core pod resource configuration
resources: {}
# xguard-core service configuration
service:
  grpc:
    annotations:
      traefik.ingress.kubernetes.io/service.serversscheme: h2c
    labels: {}
    port: 50055
    type: ClusterIP
  web:
    annotations: {}
    labels: {}
    port: 80
    type: ClusterIP
# xguard-core serviceaccount configuration
serviceAccount:
  annotations: {}
  create: true
# xguard-core pod tolerations
tolerations: []
# xguard-core additional ENV config from config map
additionalEnvFromConfigMap: ""

#
# sub-chart bitnami/postgresql
#
postgresql:
  enabled: true
  host: "" # set if using external postgresql ~ enabled: false
  port: 5432
  auth:
    database: xguard
    existingSecret: postgres-password
    existingSecretPasswordKey: "" # set if using external postgresql ~ enabled: false
    username: xguard
  image:
    repository: bitnami/postgresql
    tag: latest # IMPORTANT: set to a specific tag to avoid issues with major version upgrades

#
# sub-chart xguard-proxy
#
xguard-proxy:
  # xguard-proxy is turned off by default. enable to allow use of the enrollment interface
  enabled: false
  # this should be a URL based on xguard-proxy.ingress.web.host
  publicUrl: "http://enrollment.local"
  # xguard-proxy full name override
  fullnameOverride: ""
  # xguard-proxy name override
  nameOverride: ""
  # xguard-proxy container image configuration
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/sajjad-alaa/xguard-proxy
    tag: "" # overrides .Chart.AppVersion
  # xguard-proxy container image pull secrets configuration
  imagePullSecrets: []
  # xguard-proxy ingress configuration
  ingress:
    grpc:
      annotations: {}
      className: ""
      enabled: true
      host: enrollment-grpc.local
      labels: {}
      tls: false
    web:
      annotations: {}
      className: ""
      enabled: true
      host: enrollment.local
      labels: {}
      tls: false
  # xguard-proxy pod affinity
  affinity: {}
  # xguard-proxy pod node selection
  nodeSelector: {}
  # xguard-proxy pod tolerations
  tolerations: []
  # xguard-proxy pod annotations
  podAnnotations: {}
  # xguard-proxy pod labels
  podLabels: {}
  # xguard-proxy pod security context
  podSecurityContext: {}
  # xguard-proxy container security context
  securityContext: {}
  # xguard-proxy container replica count
  replicaCount: 1
  # xguard-proxy pod resource configuration
  resources: {}
  # xguard-proxy service configuration
  service:
    grpc:
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: h2c
      labels: {}
      port: 50051
      type: ClusterIP
    web:
      annotations: {}
      labels: {}
      port: 8080
      type: ClusterIP
  # xguard-proxy service account configuration
  serviceAccount:
    annotations: {}
    create: true
  # xguard-proxy additional ENV from configmap
  additionalEnvFromConfigMap: ""

#
# sub-chart xguard-gateway
#
xguard-gateway:
  enabled: false
  # Use userspace WireGuard implementation, useful on systems without native WireGuard support. Set to true/false
  userspace: "false"
  # Defines how often (in seconds) should interface statistics be sent to XGuard server
  statsPeriod: 30
  # rust log level, default is debug
  logLevel: "debug"
  # xguard-gateway full name override
  fullnameOverride: ""
  # xguard-gateway name override
  nameOverride: ""
  # xguard-gateway container image configuration
  image:
    pullPolicy: IfNotPresent
    repository: ghcr.io/sajjad-alaa/xguard-gateway
    tag: "" # overrides .Chart.AppVersion
  # xguard-gateway container image pull secrets
  imagePullSecrets: []
  # xguard-gateway pod affinity configuration
  affinity: {}
  # xguard-gateway node selector configuration
  nodeSelector: {}
  # xguard-gateway pod tolerations
  tolerations: []
  # xguard-gateway pod annotations
  podAnnotations: {}
  # xguard-gateway pod labels
  podLabels: {}
  # xguard-gateway pod replica count
  replicaCount: 1
  # xguard-gateway pod resources
  resources: {}
  # xguard-gateway pod security context
  podSecurityContext: {}
  # xguard-gateway container security context
  securityContext:
    allowPrivilegeEscalation: true
    privileged: true
    capabilities:
      add:
        - NET_ADMIN
        - SYS_MODULE
  # xguard-gateway pod additional ENV from configmap
  additionalEnvFromConfigMap: ""
  # xguard-gateway health check configuration
  healthCheck:
    enabled: false
    port: 35053
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
  # xguard-gateway service configuration
  service:
    grpc:
      annotations:
        traefik.ingress.kubernetes.io/service.serversscheme: h2c
      labels: {}
      port: 50066
      type: ClusterIP
    wireguard:
      annotations: {}
      labels: {}
      port: 32140
      type: ClusterIP
  # xguard-gateway serviceaccount configuration
  serviceAccount:
    annotations: {}
    create: true
