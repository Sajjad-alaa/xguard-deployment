apiVersion: v2
name: xguard
description: XGuard is an open-source enterprise WireGuard VPN with MFA and SSO.
icon: https://xguard.local/favicon/favicon-512x512.png

type: application
version: 2.2.0
appVersion: 2.2.0

dependencies:
  - name: postgresql
    condition: postgresql.enabled
    version: 18.7.11
    repository: https://charts.bitnami.com/bitnami
  - name: xguard-proxy
    condition: xguard-proxy.enabled
    version: 2.2.0
    repository: https://sajjad-alaa.github.io/xguard-deployment
    # repository: "file://../xguard-proxy"
  - name: xguard-gateway
    condition: xguard-gateway.enabled
    version: 2.2.0
    repository: https://sajjad-alaa.github.io/xguard-deployment
    # repository: "file://../xguard-gateway"
