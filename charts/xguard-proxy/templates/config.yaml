apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xguard-proxy.fullname" . }}-config
  labels:
    {{- include "xguard-proxy.labels" . | nindent 4 }}
data:
  XGUARD_PROXY_HTTP_PORT: {{ .Values.service.web.port | quote }}
  XGUARD_PROXY_GRPC_PORT: {{ .Values.service.grpc.port | quote }}
  XGUARD_PROXY_URL: {{ .Values.publicUrl | quote }}
