services:
  core:
    restart: unless-stopped
    #journald logging:
    #journald   driver: journald
    #journald   options:
    #journald     tag: "xguard-core"
    image: ghcr.io/sajjad-alaa/xguard-core:${XGUARD_CORE_TAG:?XGUARD_CORE_TAG is required}
    env_file: .env
    environment:
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432
      XGUARD_ADOPT_EDGE: "edge:50051"
      XGUARD_ADOPT_GATEWAY: "gateway:50066"
    depends_on:
      - db
      - edge
      - gateway
    ports:
      - "8000:8000"

  edge:
    restart: unless-stopped
    #journald logging:
    #journald   driver: journald
    #journald   options:
    #journald     tag: "xguard-edge"
    image: ghcr.io/sajjad-alaa/xguard-proxy:${XGUARD_PROXY_TAG:?XGUARD_PROXY_TAG is required}
    env_file: .env
    volumes:
      - ./.volumes/certs/edge:/etc/xguard/certs
    ports:
      - "8080:8080"
      - "443:443"
      - "80:80"

  gateway:
    restart: unless-stopped
    #journald logging:
    #journald   driver: journald
    #journald   options:
    #journald     tag: "xguard-gateway"
    image: ghcr.io/sajjad-alaa/xguard-gateway:${XGUARD_GATEWAY_TAG:?XGUARD_GATEWAY_TAG is required}
    env_file: .env
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.volumes/certs/gateway:/etc/xguard/certs
    environment:
      XGUARD_STATS_PERIOD: 10
      HEALTH_PORT: 55003
    ports:
      - "51820:51820/udp"

  db:
    restart: unless-stopped
    #journald logging:
    #journald   driver: journald
    #journald   options:
    #journald     tag: "xguard-db"
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - ./.volumes/db:/var/lib/postgresql
