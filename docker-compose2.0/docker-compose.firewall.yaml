services:
  core:
    image: ghcr.io/sajjad-alaa/xguard-core:2
    environment:
      XGUARD_COOKIE_INSECURE: "true"
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432
      XGUARD_DB_USER: xguard
      XGUARD_DB_PASSWORD: xguard
      XGUARD_DB_NAME: xguard
      XGUARD_ADOPT_EDGE: "edge1:50051"
      XGUARD_ADOPT_GATEWAY: "gateway1:50066"
      XGUARD_LOG_LEVEL: debug
    depends_on:
      - db
      - gateway1
      - edge1
    ports:
      - "8000:8000"
    networks:
      - default

  edge1:
    image: ghcr.io/sajjad-alaa/xguard-proxy:2
    volumes:
      - ./.volumes/certs2.0/edge1:/etc/xguard/certs
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    networks:
      - default

  gateway1:
    image: ghcr.io/sajjad-alaa/xguard-gateway:2
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.volumes/certs2.0/gateway1:/etc/xguard/certs
    ports:
      - "51820:51820/udp"
    environment:
      XGUARD_STATS_PERIOD: 10
      HEALTH_PORT: 55003
    networks:
      default:
      protected_net:
        ipv4_address: 10.10.20.2

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: xguard
      POSTGRES_USER: xguard
      POSTGRES_PASSWORD: xguard
    volumes:
      - ./.volumes/db2.0:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - default

  protected_app1:
    image: hashicorp/http-echo:1.0
    command: ["-text=Protected App #1"]
    networks:
      protected_net:
        ipv4_address: 10.10.20.20

  protected_app2:
    image: hashicorp/http-echo:1.0
    command: ["-text=Protected App #2"]
    networks:
      protected_net:
        ipv4_address: 10.10.20.30

networks:
  default:
  protected_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.20.0/24
