services:
  core:
    image: ghcr.io/sajjad-alaa/xguard-core:2
    environment:
      XGUARD_COOKIE_INSECURE: "true"
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432
      XGUARD_DB_USER: xguard
      XGUARD_DB_PASSWORD: xguard
      XGUARD_DB_NAME: xguard
      XGUARD_ADOPT_EDGE: "edge1:50051"
      XGUARD_ADOPT_GATEWAY: "gateway1:50066"
    depends_on:
      - db
      - gateway-lb
      - edge-lb
    ports:
      - "8000:8000"

  edge1:
    image: ghcr.io/sajjad-alaa/xguard-proxy:2
    volumes:
      - ./.volumes/certs2.0-ha/edge1:/etc/xguard/certs

  edge2:
    image: ghcr.io/sajjad-alaa/xguard-proxy:2
    volumes:
      - ./.volumes/certs2.0-ha/edge2:/etc/xguard/certs

  edge-lb:
    image: nginx:1.25-alpine
    depends_on:
      - edge1
      - edge2
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro

  gateway1:
    image: ghcr.io/sajjad-alaa/xguard-gateway:2
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.volumes/certs2.0-ha/gateway1:/etc/xguard/certs
    environment:
      XGUARD_STATS_PERIOD: 10
      HEALTH_PORT: 55003

  gateway2:
    image: ghcr.io/sajjad-alaa/xguard-gateway:2
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.volumes/certs2.0-ha/gateway2:/etc/xguard/certs
    environment:
      XGUARD_STATS_PERIOD: 10
      HEALTH_PORT: 55003

  gateway-lb:
    image: envoyproxy/envoy:v1.38-latest
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "-l", "debug"]
    ports:
      - "51820:51820/udp"
      - "9901:9901"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - gateway1
      - gateway2

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: xguard
      POSTGRES_USER: xguard
      POSTGRES_PASSWORD: xguard
    volumes:
      - ./.volumes/db2.0-ha:/var/lib/postgresql
