services:
  core:
    image: ghcr.io/sajjad-alaa/xguard-core:2
    environment:
      XGUARD_COOKIE_INSECURE: "true"
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432
      XGUARD_DB_USER: xguard
      XGUARD_DB_PASSWORD: xguard
      XGUARD_DB_NAME: xguard
      XGUARD_ADOPT_EDGE: "edge1:50051"
      XGUARD_ADOPT_GATEWAY: "gateway1:50066"
    depends_on:
      - db
      - gateway1
      - edge1
    ports:
      - "8000:8000"

  edge1:
    image: ghcr.io/sajjad-alaa/xguard-proxy:2
    volumes:
      - ./.volumes/certs2.0/edge1:/etc/xguard/certs
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"

  gateway1:
    image: ghcr.io/sajjad-alaa/xguard-gateway:2
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.volumes/certs2.0/gateway1:/etc/xguard/certs
    ports:
      - "51820:51820/udp"
    environment:
      XGUARD_STATS_PERIOD: 10
      HEALTH_PORT: 55003

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: xguard
      POSTGRES_USER: xguard
      POSTGRES_PASSWORD: xguard
    volumes:
      - ./.volumes/db2.0:/var/lib/postgresql

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

  openldap:
    image: bitnamilegacy/openldap:2.6
    user: root
    restart: unless-stopped
    environment:
      LDAP_ADMIN_PASSWORD: "pass123"
    ports:
      - "389:1389"
    volumes:
      - ./ldap/entrypoint:/docker-entrypoint-initdb.d:ro
      - ./ldap/init.ldif:/ldifs/init.ldif:ro
      - ./ldap/custom.ldif:/schema/custom.ldif:ro
      - ./volumes/openldap:/bitnami/openldap

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    restart: unless-stopped
    depends_on:
      - openldap
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "#PYTHON2BASH:[{'openldap': [{'server': [{'host':
        'openldap', 'port': 1389}]}]}]"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
