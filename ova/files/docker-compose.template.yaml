services:
  core:
    restart: unless-stopped
    profiles: [core]
    logging:
      driver: journald
      options:
        tag: "xguard-core"
    image: ghcr.io/sajjad-alaa/xguard-core:__XGUARD_CORE_TAG__
    env_file: .env
    environment:
      XGUARD_DB_HOST: db
      XGUARD_DB_PORT: 5432
      XGUARD_ADOPT_EDGE: ${XGUARD_ADOPT_EDGE:-}
      XGUARD_ADOPT_GATEWAY: ${XGUARD_ADOPT_GATEWAY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
    ports:
      - "8000:8000"

  edge:
    restart: unless-stopped
    profiles: [edge]
    logging:
      driver: journald
      options:
        tag: "xguard-edge"
    image: ghcr.io/sajjad-alaa/xguard-proxy:__XGUARD_PROXY_TAG__
    volumes:
      - ./.volumes/certs/edge:/etc/xguard/certs
    ports:
      - "8080:8080"
      - "443:443"
      - "80:80"
    # 50051 is added conditionally by generate-compose.sh: exposed for segmented
    # deployments (core reaches edge from another host), omitted for the full
    # all-in-one stack (core reaches edge via the docker-internal network).

  gateway:
    restart: unless-stopped
    profiles: [gateway]
    logging:
      driver: journald
      options:
        tag: "xguard-gateway"
    image: ghcr.io/sajjad-alaa/xguard-gateway:__XGUARD_GATEWAY_TAG__
    cap_add:
      - NET_ADMIN
    volumes:
      - ./.volumes/certs/gateway:/etc/xguard/certs
    network_mode: "host"
    environment:
      XGUARD_STATS_PERIOD: 10
      HEALTH_PORT: 55003

  dockge:
    image: louislam/dockge:1
    restart: unless-stopped
    profiles: [dockge]
    logging:
      driver: journald
      options:
        tag: "xguard-dockge"
    ports:
      - "5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.volumes/dockge:/app/data
      - /opt/stacks:/opt/stacks
    environment:
      DOCKGE_STACKS_DIR: /opt/stacks

  db:
    restart: unless-stopped
    profiles: [core]
    logging:
      driver: journald
      options:
        tag: "xguard-db"
    image: postgres:18-alpine
    env_file: .env
    volumes:
      - ./.volumes/db:/var/lib/postgresql
