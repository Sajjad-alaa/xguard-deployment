AWSTemplateFormatVersion: "2010-09-09"
Description: Full XGuard stack with Core, Proxy, Gateway, and a Database.
Parameters:
  StackPrefix:
    Type: String
    Default: xguard
    Description: Prefix for all resource names, if you want to allow multiple XGuard deployments in the same region
    AllowedPattern: ^[a-z0-9-]+$
    ConstraintDescription: Must contain only lowercase letters, numbers, and hyphens
  CoreUrl:
    Type: String
    Description: The URL for the XGuard Core (e.g., https://core.example.com)
  CoreGrpcPort:
    Type: Number
    Default: 50055
    Description: The gRPC port for the XGuard Core
  CoreHttpPort:
    Type: Number
    Default: 8000
    Description: The HTTP port for the XGuard Core web UI
  CoreCookieInsecure:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to allow insecure cookies for the XGuard Core web UI. Set to "true" only if accessing the web UI over HTTP (not recommended for production).
  CoreDefaultAdminPassword:
    Type: String
    NoEcho: true
    Description: The initial password for the XGuard dashboard admin user
  CoreInstanceType:
    Type: String
    Default: t3.micro
    Description: The instance type for the XGuard Core server
  ProxyUrl:
    Type: String
    Description: The URL for the XGuard Proxy (e.g., https://proxy.example.com)
  ProxyGrpcPort:
    Type: Number
    Default: 50051
    Description: The gRPC port for the XGuard Proxy
  ProxyHttpPort:
    Type: Number
    Default: 8000
    Description: The HTTP port for the XGuard Proxy
  ProxyInstanceType:
    Type: String
    Default: t3.micro
    Description: The instance type for the XGuard Proxy server
  GatewayInstanceType:
    Type: String
    Default: t3.micro
    Description: The instance type for the XGuard Gateway server
  DbName:
    Type: String
    Default: xguard
    Description: The name of the database
  DbUsername:
    Type: String
    Default: xguard
    Description: The username for the database
  DbPassword:
    Type: String
    NoEcho: true
    Description: The password for the database user
  DbPort:
    Type: Number
    Default: 5432
    Description: The port on which the database will listen
  DbStorage:
    Type: Number
    Default: 20
    Description: The amount of storage allocated for the database in GB
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: The instance class for the database
  VpcName:
    Type: String
    Default: xguard-vpc
    Description: The name of the VPC
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: The CIDR block for the VPC
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
    Description: The CIDR block for the first public subnet. Must be within the VPC CIDR range.
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.4.0/24
    Description: The CIDR block for the second public subnet. Must be within the VPC CIDR range.
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: The CIDR block for the first private subnet. Must be within the VPC CIDR range.
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.3.0/24
    Description: The CIDR block for the second private subnet. Must be within the VPC CIDR range.
  VpnNetworkName:
    Type: String
    Default: vpn1
    Description: The name of the VPN network (location)
  VpnNetworkAddress:
    Type: String
    Default: 10.10.10.1/24
    Description: The CIDR address of the VPN network (location).
  VpnNetworkPort:
    Type: Number
    Default: 51820
    Description: The UDP port for the Gateway to accept VPN connections
  VpnNetworkNat:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Whether to enable NAT for the VPN network. This may allow VPN clients to access the internet through the Gateway.
  CoreLogLevel:
    Type: String
    Default: info
    AllowedValues:
      - trace
      - debug
      - info
      - warn
      - error
    Description: Log level for XGuard Core component
  ProxyLogLevel:
    Type: String
    Default: info
    AllowedValues:
      - trace
      - debug
      - info
      - warn
      - error
    Description: Log level for XGuard Proxy component
  GatewayLogLevel:
    Type: String
    Default: info
    AllowedValues:
      - trace
      - debug
      - info
      - warn
      - error
    Description: Log level for XGuard Gateway component
  XGuardAmiId:
    Type: String
    Description: AMI ID for XGuard.
    Default: "ami-030fa11d061f26d50"
  SshKeyName:
    Type: String
    Description: (Optional) EC2 Key Pair name for SSH access to instances. If not provided, SSH access will not be available. Requires a manual setup of SSH security group rules afterwards.
    Default: ""
  SSLCertificateArn:
    Type: String
    Description: (Optional) ARN of the SSL certificate for HTTPS termination on the reverse proxies. If not provided, only HTTP will be used.
    Default: ""
Conditions:
  UseSshKey: !Not [!Equals [!Ref SshKeyName, ""]]
  UseSSLCertificate: !Not [!Equals [!Ref SSLCertificateArn, ""]]
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Ref VpcName
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-igw
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  XGuardPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public-subnet-1
  
  XGuardPublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public-subnet-2
  XGuardPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ""
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-private-subnet-1
  XGuardPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ""
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-private-subnet-2
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-public-rt
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  XGuardPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref XGuardPublicSubnet
      RouteTableId: !Ref PublicRouteTable
  
  XGuardPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref XGuardPublicSubnet2
      RouteTableId: !Ref PublicRouteTable
  NATGatewayEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-nat-eip
  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref XGuardPublicSubnet
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-nat-gateway
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${VpcName}-private-rt
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway
  XGuardPrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref XGuardPrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable
  XGuardPrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref XGuardPrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub ${StackPrefix}-db-subnet-group
      DBSubnetGroupDescription: Subnet group for XGuard database
      SubnetIds:
        - !Ref XGuardPrivateSubnet1
        - !Ref XGuardPrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-db-subnet-group
  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      DBParameterGroupName: !Sub ${StackPrefix}-db-parameter-group
      Description: Parameter group for XGuard database
      Family: postgres17
      Parameters:
        rds.force_ssl: "0"
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-db-parameter-group
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-db-sg
      GroupDescription: Access to the database
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref DbPort
          ToPort: !Ref DbPort
          SourceSecurityGroupId: !Ref CoreSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-db-sg
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-lambda-sg
      GroupDescription: Lambda function access
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-lambda-sg
  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: !Ref DbName
      DBInstanceIdentifier: !Sub ${StackPrefix}-core-db
      DBInstanceClass: !Ref DbInstanceClass
      Engine: postgres
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Ref DbPassword
      Port: !Ref DbPort
      AllocatedStorage: !Ref DbStorage
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBParameterGroupName: !Ref DBParameterGroup
      DeletionProtection: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-core-db
  CoreSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-core-sg
      GroupDescription: Core access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref CoreGrpcPort
          ToPort: !Ref CoreGrpcPort
          SourceSecurityGroupId: !Ref GatewaySecurityGroup
          Description: gRPC communication with gateways
        - IpProtocol: tcp
          FromPort: !Ref CoreHttpPort
          ToPort: !Ref CoreHttpPort
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: HTTP access from Lambda function
        - IpProtocol: tcp
          FromPort: !Ref CoreHttpPort
          ToPort: !Ref CoreHttpPort
          SourceSecurityGroupId: !Ref InternalProxyALBSecurityGroup
          Description: HTTP access from internal reverse proxy ALB
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-core-sg
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-proxy-sg
      GroupDescription: Proxy access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ProxyHttpPort
          ToPort: !Ref ProxyHttpPort
          SourceSecurityGroupId: !Ref PublicProxyALBSecurityGroup
          Description: HTTP access from public reverse proxy ALB
        - IpProtocol: tcp
          FromPort: !Ref ProxyGrpcPort
          ToPort: !Ref ProxyGrpcPort
          SourceSecurityGroupId: !Ref CoreSecurityGroup
          Description: Internal communication with core
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-proxy-sg
  GatewaySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-gateway-sg
      GroupDescription: Gateway access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: !Ref VpnNetworkPort
          ToPort: !Ref VpnNetworkPort
          CidrIp: 0.0.0.0/0
          Description: VPN traffic from clients
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-gateway-sg
  
  # Security group for the public reverse proxy (ALB)
  PublicProxyALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-public-proxy-alb-sg
      GroupDescription: Public reverse proxy ALB access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP access from internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS access from internet
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-public-proxy-alb-sg
  
  # Security group for the internal reverse proxy (ALB)
  InternalProxyALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${StackPrefix}-internal-proxy-alb-sg
      GroupDescription: Internal reverse proxy ALB access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref GatewaySecurityGroup
          Description: HTTP access from gateways
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref GatewaySecurityGroup
          Description: HTTPS access from gateways
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-internal-proxy-alb-sg
  CoreNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref XGuardPrivateSubnet1
      GroupSet:
        - !Ref CoreSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-core-network-interface
  ProxyNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref XGuardPublicSubnet
      GroupSet:
        - !Ref ProxySecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-proxy-network-interface
  ProxyElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-proxy-eip
  ProxyEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      NetworkInterfaceId: !Ref ProxyNetworkInterface
      AllocationId: !GetAtt ProxyElasticIP.AllocationId
  GatewayNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      SubnetId: !Ref XGuardPublicSubnet
      GroupSet:
        - !Ref GatewaySecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-gateway-network-interface
  GatewayElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-gateway-eip
  GatewayEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      NetworkInterfaceId: !Ref GatewayNetworkInterface
      AllocationId: !GetAtt GatewayElasticIP.AllocationId

  # Public reverse proxy (ALB) for XGuard Proxy
  PublicProxyALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${StackPrefix}-public-proxy-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref XGuardPublicSubnet
        - !Ref XGuardPublicSubnet2
      SecurityGroups:
        - !Ref PublicProxyALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-public-proxy-alb

  # Target group for the public reverse proxy
  PublicProxyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${StackPrefix}-public-proxy-tg
      Port: !Ref ProxyHttpPort
      Protocol: HTTP
      VpcId: !Ref VPC
      HealthCheckEnabled: true
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      TargetType: ip
      Targets:
        - Id: !GetAtt ProxyNetworkInterface.PrimaryPrivateIpAddress
          Port: !Ref ProxyHttpPort
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-public-proxy-tg

  # HTTP listener for public reverse proxy
  PublicProxyHTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PublicProxyTargetGroup
      LoadBalancerArn: !Ref PublicProxyALB
      Port: 80
      Protocol: HTTP

  # HTTPS listener for public reverse proxy (only if SSL certificate is provided)
  PublicProxyHTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseSSLCertificate
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PublicProxyTargetGroup
      LoadBalancerArn: !Ref PublicProxyALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn

  # Internal reverse proxy (ALB) for XGuard Core
  InternalProxyALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub ${StackPrefix}-internal-proxy-alb
      Type: application
      Scheme: internal
      IpAddressType: ipv4
      Subnets:
        - !Ref XGuardPrivateSubnet1
        - !Ref XGuardPrivateSubnet2
      SecurityGroups:
        - !Ref InternalProxyALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-internal-proxy-alb

  # Target group for the internal reverse proxy (HTTP)
  InternalProxyHTTPTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${StackPrefix}-internal-proxy-http-tg
      Port: !Ref CoreHttpPort
      Protocol: HTTP
      VpcId: !Ref VPC
      HealthCheckEnabled: true
      HealthCheckPath: /api/v1/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      TargetType: ip
      Targets:
        - Id: !GetAtt CoreNetworkInterface.PrimaryPrivateIpAddress
          Port: !Ref CoreHttpPort
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-internal-proxy-http-tg

  # HTTP listener for internal reverse proxy
  InternalProxyHTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref InternalProxyHTTPTargetGroup
      LoadBalancerArn: !Ref InternalProxyALB
      Port: 80
      Protocol: HTTP

  # HTTPS listener for internal reverse proxy (only if SSL certificate is provided)
  InternalProxyHTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseSSLCertificate
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref InternalProxyHTTPTargetGroup
      LoadBalancerArn: !Ref InternalProxyALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref SSLCertificateArn

  # IAM Role for Core Instance
  CoreInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:CreateSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${AWS::StackName}/grpc/*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${AWS::StackName}/gateway/*

  CoreInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CoreInstanceRole

  # IAM Role for Proxy Instance
  ProxyInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${AWS::StackName}/grpc/*

  ProxyInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ProxyInstanceRole

  # IAM Role for Gateway Instance
  GatewayInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${AWS::StackName}/grpc/*
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/${AWS::StackName}/gateway/*

  GatewayInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref GatewayInstanceRole

  CoreInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref XGuardAmiId
      InstanceType: !Ref CoreInstanceType
      KeyName: !If [UseSshKey, !Ref SshKeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref CoreInstanceProfile
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref CoreNetworkInterface
          DeviceIndex: "0"
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -e
            LOG_FILE="/var/log/xguard.log"

            log() {
                echo "$(date '+%Y-%m-%d %H:%M:%S') $1"
            }

            generate_secret_inner() {
                local length="$1"
                openssl rand -base64 "$length" | tr -d "=+/" | tr -d '\n' | cut -c1-"$length"
            }

            (

            log "Generating gateway secret..."
            GATEWAY_SECRET=$(generate_secret_inner 64)
            
            log "Storing gateway secret in Secrets Manager..."
            aws secretsmanager create-secret --name "/${AWS::StackName}/gateway/secret" --secret-string "$GATEWAY_SECRET" --region ${AWS::Region} || \
              aws secretsmanager put-secret-value --secret-id "/${AWS::StackName}/gateway/secret" --secret-string "$GATEWAY_SECRET" --region ${AWS::Region}
            
            log "Writing Core configuration to /etc/xguard/core.conf..."
            mkdir -p /etc/xguard
            tee /etc/xguard/core.conf <<EOF
            ### Core configuration ###
            XGUARD_AUTH_SECRET=$(generate_secret_inner 64)
            XGUARD_GATEWAY_SECRET=$GATEWAY_SECRET
            XGUARD_YUBIBRIDGE_SECRET=$(generate_secret_inner 64)
            XGUARD_SECRET_KEY=$(generate_secret_inner 64)
            XGUARD_URL=${CoreUrl}
            XGUARD_AUTH_SESSION_LIFETIME=604800
            XGUARD_ADMIN_GROUPNAME=admin
            XGUARD_DEFAULT_ADMIN_PASSWORD=${CoreDefaultAdminPassword}
            XGUARD_GRPC_PORT=${CoreGrpcPort}
            XGUARD_HTTP_PORT=${CoreHttpPort}
            XGUARD_COOKIE_INSECURE=${CoreCookieInsecure}
            XGUARD_LOG_LEVEL=${CoreLogLevel}
            
            ### gRPC SSL configuration ###
            XGUARD_PROXY_GRPC_CA=/etc/xguard/ssl/xguard-ca.pem
            XGUARD_GRPC_CERT=/etc/xguard/ssl/xguard-grpc.crt
            XGUARD_GRPC_KEY=/etc/xguard/ssl/xguard-grpc.key

            ### Proxy configuration ###
            XGUARD_PROXY_URL=https://${ProxyNetworkInterface.PrimaryPrivateIpAddress}:${ProxyGrpcPort}
            XGUARD_ENROLLMENT_URL=${ProxyUrl}

            ### DB configuration ###
            XGUARD_DB_HOST="${Database.Endpoint.Address}"
            XGUARD_DB_PORT=${DbPort}
            XGUARD_DB_NAME="${DbName}"
            XGUARD_DB_USER="${DbUsername}"
            XGUARD_DB_PASSWORD="${DbPassword}"
            EOF

            log "Generating gRPC SSL certificates..."

            mkdir -p /etc/xguard/ssl
            cd /etc/xguard/ssl
            
            # Extract domain from CoreUrl
            DOMAIN=$(echo "${CoreUrl}" | sed 's|https\?://||' | cut -d'/' -f1)
            PASSPHRASE=$(generate_secret_inner 64)

            openssl genrsa -des3 -out xguard-ca.key -passout pass:"${!PASSPHRASE}" 2048 2>&1
            openssl req -x509 -new -nodes -key xguard-ca.key -sha256 -days 1825 -out xguard-ca.pem -passin pass:"${!PASSPHRASE}" -subj "/CN=${!DOMAIN}" 2>&1
            openssl genrsa -out xguard-grpc.key 2048 2>&1
            openssl req -new -key xguard-grpc.key -out xguard-grpc.csr -subj "/CN=${!DOMAIN}" 2>&1
            cat >xguard-grpc.ext <<EOF
            authorityKeyIdentifier=keyid,issuer
            basicConstraints=CA:FALSE
            keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
            subjectAltName = @alt_names
            [alt_names]
            IP.1 = ${CoreNetworkInterface.PrimaryPrivateIpAddress}
            DNS.1= localhost
            EOF

            openssl x509 -req -in xguard-grpc.csr -CA xguard-ca.pem -CAkey xguard-ca.key -passin pass:"${!PASSPHRASE}" -CAcreateserial \
            -out xguard-grpc.crt -days 1000 -sha256 -extfile xguard-grpc.ext 2>&1
            
            openssl genrsa -out xguard-proxy-grpc.key 2048 2>&1

            openssl req -new -key xguard-proxy-grpc.key -out xguard-proxy-grpc.csr -subj "/CN=${!DOMAIN}" 2>&1
            cat >xguard-proxy-grpc.ext <<EOF
            authorityKeyIdentifier=keyid,issuer
            basicConstraints=CA:FALSE
            keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
            subjectAltName = @alt_names
            [alt_names]
            IP.1 = ${ProxyNetworkInterface.PrimaryPrivateIpAddress}
            DNS.1 = localhost
            EOF
            openssl x509 -req -in xguard-proxy-grpc.csr -CA xguard-ca.pem -CAkey xguard-ca.key -passin pass:"${!PASSPHRASE}" -CAcreateserial \
              -out xguard-proxy-grpc.crt -days 1000 -sha256 -extfile xguard-proxy-grpc.ext 2>&1

            # Set permissions
            chmod 644 /etc/xguard/ssl/*.key
            chmod 644 /etc/xguard/ssl/*.pem /etc/xguard/ssl/*.crt
            
            # Store certificates in Secrets Manager for other instances
            log "Storing certificates in Secrets Manager..."
            aws secretsmanager create-secret --name "/${AWS::StackName}/grpc/ca-pem" --secret-string file://xguard-ca.pem --region ${AWS::Region} || \
              aws secretsmanager put-secret-value --secret-id "/${AWS::StackName}/grpc/ca-pem" --secret-string file://xguard-ca.pem --region ${AWS::Region}
            
            aws secretsmanager create-secret --name "/${AWS::StackName}/grpc/ca-passphrase" --secret-string "${!PASSPHRASE}" --region ${AWS::Region} || \
              aws secretsmanager put-secret-value --secret-id "/${AWS::StackName}/grpc/ca-passphrase" --secret-string "${!PASSPHRASE}" --region ${AWS::Region}
            
            aws secretsmanager create-secret --name "/${AWS::StackName}/grpc/proxy-key" --secret-string file://xguard-proxy-grpc.key --region ${AWS::Region} || \
              aws secretsmanager put-secret-value --secret-id "/${AWS::StackName}/grpc/proxy-key" --secret-string file://xguard-proxy-grpc.key --region ${AWS::Region}
            
            aws secretsmanager create-secret --name "/${AWS::StackName}/grpc/proxy-crt" --secret-string file://xguard-proxy-grpc.crt --region ${AWS::Region} || \
              aws secretsmanager put-secret-value --secret-id "/${AWS::StackName}/grpc/proxy-crt" --secret-string file://xguard-proxy-grpc.crt --region ${AWS::Region}
            
            # Clean up temporary files
            rm -f xguard-grpc.csr xguard-grpc.ext xguard-proxy-grpc.csr xguard-proxy-grpc.ext xguard-ca.key xguard-ca.srl
            
            log "gRPC SSL certificates generated and stored"

            log "Enabling xguard service..."
            systemctl enable xguard

            log "Starting xguard service..."
            systemctl start xguard

            log "Creating VPN location with address ${VpnNetworkAddress} and endpoint ${GatewayElasticIP} and port ${VpnNetworkPort}..."
            export $(grep -v '^#' /etc/xguard/core.conf | xargs) && /usr/bin/xguard --secret-key "$GATEWAY_SECRET" init-vpn-location --name ${VpnNetworkName} --address ${VpnNetworkAddress} --endpoint ${GatewayElasticIP} --port ${VpnNetworkPort} --id 1 --allowed-ips ${VpnNetworkAddress} --allowed-ips ${VpcCidr} >> "$LOG_FILE" 2>&1

            log "Created VPN location ${VpnNetworkName} with address ${VpnNetworkAddress} and endpoint ${GatewayElasticIP} and port ${VpnNetworkPort}"

            log "Setup completed."
            ) 2>&1 | tee -a "$LOG_FILE"
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-core-instance
    DependsOn:
      - Database
  ProxyInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref XGuardAmiId
      InstanceType: !Ref ProxyInstanceType
      KeyName: !If [UseSshKey, !Ref SshKeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref ProxyInstanceProfile
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref ProxyNetworkInterface
          DeviceIndex: "0"
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -e
            LOG_FILE="/var/log/xguard.log"

            log() {
                echo "$(date '+%Y-%m-%d %H:%M:%S') $1"
            }

            (

            log "Writing proxy configuration to /etc/xguard/proxy.toml..."
            mkdir -p /etc/xguard
            tee /etc/xguard/proxy.toml <<EOF
            # port the API server will listen on
            http_port = ${ProxyHttpPort}
            # port the gRPC server will listen on
            grpc_port = ${ProxyGrpcPort}

            log_level = "${ProxyLogLevel}"
            rate_limit_per_second = 0
            rate_limit_burst = 0
            url = "${ProxyUrl}"

            # gRPC SSL configuration
            grpc_cert = "/etc/xguard/ssl/xguard-proxy-grpc.crt"
            grpc_key = "/etc/xguard/ssl/xguard-proxy-grpc.key"

            EOF

            log "Retrieving gRPC SSL certificates from Secrets Manager..."
            mkdir -p /etc/xguard/ssl
            aws secretsmanager get-secret-value --secret-id "/${AWS::StackName}/grpc/proxy-key" --region ${AWS::Region} --query 'SecretString' --output text > /etc/xguard/ssl/xguard-proxy-grpc.key
            aws secretsmanager get-secret-value --secret-id "/${AWS::StackName}/grpc/proxy-crt" --region ${AWS::Region} --query 'SecretString' --output text > /etc/xguard/ssl/xguard-proxy-grpc.crt
            chmod 644 /etc/xguard/ssl/*.key /etc/xguard/ssl/*.crt
            log "gRPC SSL certificates retrieved and configured"

            log "Enabling xguard-proxy service..."
            systemctl enable xguard-proxy

            log "Starting xguard-proxy service..."
            systemctl start xguard-proxy

            log "Setup completed."
            ) 2>&1 | tee -a "$LOG_FILE"
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-proxy-instance
    DependsOn:
      - CoreInstance
  GatewayInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref XGuardAmiId
      InstanceType: !Ref GatewayInstanceType
      KeyName: !If [UseSshKey, !Ref SshKeyName, !Ref "AWS::NoValue"]
      IamInstanceProfile: !Ref GatewayInstanceProfile
      NetworkInterfaces:
        - NetworkInterfaceId: !Ref GatewayNetworkInterface
          DeviceIndex: "0"
      UserData:
        Fn::Base64:
          Fn::Sub:
          - |
            #!/bin/bash
            set -e
            LOG_FILE="/var/log/xguard.log"

            log() {
                echo "$(date '+%Y-%m-%d %H:%M:%S') $1"
            }

            base64url_encode() {
                echo -n "$1" | openssl base64 -e -A | tr '+/' '-_' | tr -d '='
            }

            (

            log "Retrieving gRPC CA certificate from Secrets Manager..."
            mkdir -p /etc/xguard/ssl
            aws secretsmanager get-secret-value --secret-id "/${AWS::StackName}/grpc/ca-pem" --region ${AWS::Region} --query 'SecretString' --output text > /etc/xguard/ssl/xguard-ca.pem
            chmod 644 /etc/xguard/ssl/xguard-ca.pem
            log "gRPC CA certificate retrieved"
            
            log "Retrieving gateway secret from Secrets Manager..."
            SECRET=$(aws secretsmanager get-secret-value --secret-id "/${AWS::StackName}/gateway/secret" --region ${AWS::Region} --query 'SecretString' --output text)
            log "Gateway secret retrieved"
            
            log "Generating gateway token..."
            NETWORK_ID="1"
            ISSUER="XGuard"

            HEADER='{"alg":"HS256","typ":"JWT"}'
            NOW=$(date +%s)
            EXPIRATION=$(($NOW + 315360000))
            PAYLOAD=$(cat <<EOF
            {
              "iss": "$ISSUER",
              "sub": "XGUARD-NETWORK-$NETWORK_ID",
              "client_id": "$NETWORK_ID",
              "exp": $EXPIRATION,
              "nbf": $NOW
            }
            EOF
            )
            HEADER_B64=$(base64url_encode "$HEADER")
            PAYLOAD_B64=$(base64url_encode "$PAYLOAD")
            SIGNING_INPUT="$HEADER_B64.$PAYLOAD_B64"
            SIGNATURE=$(echo -n "$SIGNING_INPUT" | openssl dgst -sha256 -hmac "$SECRET" -binary | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')

            GATEWAY_TOKEN="$SIGNING_INPUT.$SIGNATURE"

            log "Writing gateway configuration to /etc/xguard/gateway.toml..."
            mkdir -p /etc/xguard
            tee /etc/xguard/gateway.toml <<EOF
            # This is an example config file for xguard VPN gateway
            # To use it fill in actual values for your deployment below

            # Required: secret token generated by xguard
            # NOTE: must replace default with actual value
            token = "$GATEWAY_TOKEN"
            # Required: xguard server gRPC endpoint URL
            # NOTE: must replace default with actual value
            grpc_url = "https://${CorePrivateIP}:${CoreGrpcPort}"
            # Optional: gateway name which will be displayed in xguard web UI
            name = "xguard-gateway-1"
            # Required: use userspace WireGuard implementation (e.g. wireguard-go)
            userspace = false
            # Optional: path to TLS cert file
            grpc_ca = "/etc/xguard/ssl/xguard-ca.pem"
            # Required: how often should interface stat updates be sent to xguard server (in seconds)
            stats_period = 60
            # Required: name of WireGuard interface
            ifname = "wg0"
            # Optional: write PID to this file
            # pidfile = xguard-gateway.pid
            # Required: enable logging to syslog
            use_syslog = false
            # Required: which syslog facility to use
            syslog_facility = "LOG_USER"
            # Required: which socket to use for logging
            syslog_socket = "/var/run/log"

            # Optional: Command which will be run before bringing interface up
            # Example: Allow all traffic through WireGuard interface:
            #pre_up = "/path/to/iptables -A INPUT -i wg0 -j ACCEPT
            # example with multiple commands - add them to a shell script
            #pre_up = "/path/to/shell /path/to/script"

            # Optional: Command which will be run after bringing interface up
            # Example: Add a default route after WireGuard interface is up:
            #post_up = "/path/to/ip route add default via 192.168.1.1 dev wg0"

            # Optional: Command which will be run before bringing interface down
            # Example: Remove WireGuard-related firewall rules before interface is taken down:
            #pre_down = "/path/to/iptables -D INPUT -i wg0 -j ACCEPT"

            # Optional: Command which will be run after bringing interface down
            # Example: Remove the default route after WireGuard interface is down:
            #post_down = "/pat/to/ip route del default via 192.168.1.1 dev wg0"

            # A HTTP port that will expose the REST HTTP gateway health status
            # STATUS CODES:
            # 200 - Gateway is working and is connected to CORE
            # 503 - gateway works but is not connected to CORE
            #health_port = 55003

            # Optional: Enable automatic masquerading of traffic by the firewall
            masquerade = ${VpnNetworkNat}

            # Optional: Set the priority of the XGuard forward chain
            #fw_priority = 0

            log_level = "${GatewayLogLevel}"
            EOF

            if [ "${VpnNetworkNat}" = "true" ]; then
              log "Enabling IP forwarding for NAT (IPv4)..."
              sysctl -w net.ipv4.ip_forward=1
              grep -q -e '^net.ipv4.ip_forward' /etc/sysctl.conf || echo "net.ipv4.ip_forward = 1" | tee -a /etc/sysctl.conf

              log "Enabling IP forwarding for NAT (IPv6)..."
              sysctl -w net.ipv6.conf.all.forwarding=1
              grep -q -e '^net.ipv6.conf.all.forwarding' /etc/sysctl.conf || echo "net.ipv6.conf.all.forwarding = 1" | tee -a /etc/sysctl.conf
            fi

            log "Reloading systemd daemon to apply changes..."
            systemctl daemon-reload

            log "Enabling xguard-gateway service..."
            systemctl enable xguard-gateway

            log "Starting xguard-gateway service..."
            systemctl start xguard-gateway
            log "testing secret string generation..."

            log "Setup completed."
            ) 2>&1 | tee -a "$LOG_FILE"
          - { CorePrivateIP: !GetAtt CoreNetworkInterface.PrimaryPrivateIpAddress }
      Tags:
        - Key: Name
          Value: !Sub ${StackPrefix}-gateway-instance
    DependsOn:
      - CoreInstance

  # Lambda function to call XGuard API for device creation
  XGuardFirstDeviceFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${StackPrefix}-xguard-device-setup
      Runtime: python3.9
      Handler: index.handler
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref XGuardPrivateSubnet1
      Code:
        ZipFile: |
          import json
          import urllib.request
          import urllib.parse
          import urllib.error
          import time
          
          def send_response(event, context, response_status, response_data=None, physical_resource_id=None):
              if response_data is None:
                  response_data = {}
              
              # Use existing ID for updates/deletes, let CloudFormation generate one for creates
              if physical_resource_id is None and event['RequestType'] != 'Create':
                  physical_resource_id = event.get('PhysicalResourceId', 'XGuardDeviceSetup')
              elif physical_resource_id is None:
                  physical_resource_id = 'XGuardDeviceSetup'
              
              response_url = event['ResponseURL']
              
              response_body = {
                  'Status': response_status,
                  'Reason': f'See CloudWatch Log Stream: {context.log_stream_name}',
                  'PhysicalResourceId': physical_resource_id,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': response_data
              }
              
              json_response_body = json.dumps(response_body).encode('utf-8')
              
              print(f"Sending response to {response_url}")
              print(f"Response body: {json.dumps(response_body, indent=2)}")
              
              try:
                  request = urllib.request.Request(
                      response_url,
                      data=json_response_body,
                      headers={
                          'Content-Type': '',
                          'Content-Length': str(len(json_response_body))
                      },
                      method='PUT'
                  )
                  
                  response = urllib.request.urlopen(request, timeout=30)
                  print(f"Response sent successfully. Status: {response.status}")
                  return True
                  
              except Exception as e:
                  print(f"Failed to send response: {str(e)}")
                  return False
          
          def handler(event, context):
              print(f"Event: {json.dumps(event, indent=2)}")
              
              try:
                  if event['RequestType'] == 'Create':
                      core_ip = event['ResourceProperties']['CoreIP']
                      core_port = event['ResourceProperties']['CorePort']
                      admin_password = event['ResourceProperties']['AdminPassword']
                      
                      max_retries = 5
                      for attempt in range(max_retries):
                          try:
                              print(f"Attempt {attempt + 1}/{max_retries} to create device")
                              token = create_user_device(core_ip, core_port, admin_password)
                              
                              response_data = {
                                  'Token': token,
                                  'Message': 'Device created successfully'
                              }
                              
                              print(f"Sending SUCCESS response with token: {token}")
                              return send_response(event, context, 'SUCCESS', response_data)
                              
                          except Exception as e:
                              print(f"Attempt {attempt + 1} failed: {str(e)}")
                              if attempt < max_retries - 1:
                                  print(f"Waiting 30 seconds before retry...")
                                  time.sleep(30)
                              else:
                                  raise e
                      
                  elif event['RequestType'] in ['Update', 'Delete']:
                      response_data = {'Message': f'{event["RequestType"]} operation completed'}
                      print(f"Sending SUCCESS response for {event['RequestType']}")
                      return send_response(event, context, 'SUCCESS', response_data, event.get('PhysicalResourceId'))
                      
              except Exception as e:
                  error_msg = str(e)
                  print(f"Error occurred: {error_msg}")
                  response_data = {'Error': error_msg}
                  return send_response(event, context, 'FAILED', response_data)
          
          def create_user_device(core_ip, core_port, admin_password):
              base_url = f"http://{core_ip}:{core_port}"
              
              print("Authenticating as admin...")
              auth_data = json.dumps({
                  "username": "admin",
                  "password": admin_password
              }).encode('utf-8')
              
              auth_request = urllib.request.Request(
                  f"{base_url}/api/v1/auth",
                  data=auth_data,
                  headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'XGuard-CloudFormation-Setup/1.0'
                  },
                  method='POST'
              )
              
              try:
                  auth_response = urllib.request.urlopen(auth_request)
                  if auth_response.status != 200:
                      raise Exception(f"Authentication failed: {auth_response.status}")
              except urllib.error.HTTPError as e:
                  raise Exception(f"Authentication failed: {e.code} - {e.read().decode()}")
              
              session_cookie = None
              for header_name, header_value in auth_response.headers.items():
                  if header_name.lower() == 'set-cookie' and 'xguard_session=' in header_value:
                      session_cookie = header_value.split('xguard_session=')[1].split(';')[0]
                      break
              
              if not session_cookie:
                  raise Exception("No session cookie received from authentication")
              
              print(f"Authentication successful, session cookie: {session_cookie[:20]}...")
              
              print("Creating enrollment token...")
              token_data = json.dumps({
                  "email": "",
                  "send_enrollment_notification": False,
                  "username": "admin"
              }).encode('utf-8')
              
              token_request = urllib.request.Request(
                  f"{base_url}/api/v1/user/admin/start_desktop",
                  data=token_data,
                  headers={
                      'Content-Type': 'application/json',
                      'User-Agent': 'XGuard-CloudFormation-Setup/1.0',
                      'Cookie': f'xguard_session={session_cookie}'
                  },
                  method='POST'
              )
              
              try:
                  token_response = urllib.request.urlopen(token_request)
                  response_data = json.loads(token_response.read().decode('utf-8'))
                  enrollment_token = response_data.get('enrollment_token', 'TOKEN_NOT_FOUND')
                  enrollment_url = response_data.get('enrollment_url', 'URL_NOT_FOUND')
                  print(f"Enrollment token created successfully: {enrollment_token}")
                  print(f"Enrollment URL: {enrollment_url}")
                  return enrollment_token
              except urllib.error.HTTPError as e:
                  error_msg = e.read().decode()
                  print(f"Token creation failed: {e.code} - {error_msg}")
                  return f"API_CALL_FAILED_{e.code}_{error_msg[:50]}"
      Role: !GetAtt XGuardApiRole.Arn
      Timeout: 300
